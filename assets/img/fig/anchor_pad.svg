<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="560" height="320" role="img" aria-labelledby="t d">
<title id="t">Contact force anchor on one finger pad</title>
<desc id="d">A fingertip touches an object. The pad vertices x_v within contact distance are shaded by their pressure w_v and carry outward normals n_v. The anchor point c_f is their pressure-weighted centroid, snapped onto the skin; the push direction d_f is their pressure-weighted mean normal, pointing into the object; the force F_f is the total pressure, drawn as the arrow length.</desc>
